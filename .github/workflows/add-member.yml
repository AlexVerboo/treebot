name: Add member

on:
  workflow_dispatch:
    inputs:
      gamertag:
        description: "Gamertag de Xbox del miembro nuevo"
        required: true
        type: string

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-updater.txt
      - name: Agregar a la hoja
        run: python add_member.py "$GAMERTAG"
        env:
          GAMERTAG: ${{ inputs.gamertag }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          HALO_REFRESH_TOKEN: ${{ secrets.HALO_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
      - name: Alert on failure
        if: failure()
        env:
          DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python alerts.py "Workflow **$GITHUB_WORKFLOW** failed ($GITHUB_EVENT_NAME). Logs: $RUN_URL"
