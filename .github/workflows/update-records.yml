name: Update Halo records

on:
  schedule:
    # Backup: the bot starts this workflow at 06:17 UTC (00:17 Mexico City) through
    # the API (scheduler.py). GitHub's cron often runs hours late; if the job
    # already ran today, the "guard" job skips it.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar, sin escribir en la hoja ni avisar en GroupMe"
        type: boolean
        default: false

concurrency:
  group: update-records
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u +%Y-%m-%dT06:00:00Z)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update-records.yml/runs?created=%3E%3D$since&per_page=20" \
                --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")] | length")
          echo "Other runs today: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  update:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      HALO_REFRESH_TOKEN: ${{ secrets.HALO_REFRESH_TOKEN }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
      DATABASE_URL: ${{ secrets.NEON_PROD_POOLER }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-updater.txt
      - run: pip install -r requirements-updater.txt
      - name: Migrate database
        # A database problem must never stop the records and the sheet (migrate.py alerts)
        continue-on-error: true
        run: python migrate.py
      - name: Buscar récords nuevos
        run: python records_updater.py
        env:
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          ANNOUNCE_RECORDS: ${{ vars.ANNOUNCE_RECORDS || '' }}
          MIN_GROUP_PLAYERS: ${{ vars.MIN_GROUP_PLAYERS || '5' }}
      - name: Stats por jugador (página de roles)
        if: always()
        run: python player_stats_updater.py
        env:
          STATS_SEASON: ${{ vars.STATS_SEASON || '' }}
      - name: Save new matches (database)
        if: always() && env.DRY_RUN != '1'
        run: python ingest.py --source daily
        env:
          INGEST_HOURS: ${{ vars.INGEST_HOURS || '48' }}
      - name: Alert on failure
        if: failure()
        env:
          DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python alerts.py "Workflow **$GITHUB_WORKFLOW** failed ($GITHUB_EVENT_NAME). Logs: $RUN_URL"
