name: Database

# Manual maintenance tasks. "target" picks the Neon branch:
#   production -> secret NEON_PROD_POOLER     dev -> secret NEON_DEV_POOLER (tests)
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Qué hacer (migrate siempre corre primero)"
        type: choice
        options: [status, migrate, import-sheets, backfill, awards-preview]
        default: status
      target:
        description: "Rama de Neon"
        type: choice
        options: [dev, production]
        default: dev
      days:
        description: "backfill: días de historial"
        default: "30"
        type: string
      gamertag:
        description: "backfill: solo este miembro (vacío = todos)"
        default: ""
        type: string
      night:
        description: "awards-preview: noche YYYY-MM-DD (vacío = la última)"
        default: ""
        type: string

concurrency:
  group: database-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ inputs.target == 'production' && secrets.NEON_PROD_POOLER || secrets.NEON_DEV_POOLER }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      HALO_REFRESH_TOKEN: ${{ secrets.HALO_REFRESH_TOKEN }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
    steps:
      - name: Check the secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing secret for target '${{ inputs.target }}' (NEON_PROD_POOLER or NEON_DEV_POOLER)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-updater.txt
      - run: pip install -r requirements-updater.txt
      - name: Status
        if: inputs.task == 'status'
        run: python migrate.py --status
      - name: Migrate
        if: inputs.task != 'status'
        run: python migrate.py
      - name: Import from Google Sheets
        if: inputs.task == 'import-sheets'
        run: python import_sheets.py
      - name: Backfill matches
        if: inputs.task == 'backfill'
        run: python ingest.py --source backfill --days "$DAYS" ${GAMERTAG:+--gamertag "$GAMERTAG"}
        env:
          DAYS: ${{ inputs.days }}
          GAMERTAG: ${{ inputs.gamertag }}
      - name: Night awards preview (does not post)
        if: inputs.task == 'awards-preview'
        run: python awards.py --dry-run ${NIGHT:+--night "$NIGHT"}
        env:
          NIGHT: ${{ inputs.night }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || '' }}
          GGS_MIN_PLAYERS: ${{ vars.GGS_MIN_PLAYERS || '' }}
          AWARDS_MIN_GAMES: ${{ vars.AWARDS_MIN_GAMES || '' }}
          AWARDS_DUO_MIN_GAMES: ${{ vars.AWARDS_DUO_MIN_GAMES || '' }}
      - name: Alert on failure
        if: failure() && inputs.target == 'production'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python alerts.py "Workflow **$GITHUB_WORKFLOW** (${{ inputs.task }}) failed. Logs: $RUN_URL"
